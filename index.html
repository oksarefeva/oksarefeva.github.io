<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My page</title>
    <link rel="icon" href="favicon.png" type="image/png">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="style.css"/>
    <script src="https://unpkg.com/i18next@25.3.6/i18next.min.js"></script>
    <script src="https://unpkg.com/i18next-http-backend@3.0.2/i18nextHttpBackend.min.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js" defer></script>
    <script src="main.js" defer></script>
</head>

<body>
<header>
    <nav class="navbar navbar-expand-lg ms-3">
        <div class="container-fluid">
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNavDropdown" aria-controls="navbarNavDropdown" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNavDropdown">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" data-i18n="home" aria-current="page" href="#"></a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" data-i18n="about" aria-current="page" href="#aboutMe"></a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" data-i18n="contacts" aria-current="page" href="#contact"></a>
                    </li>
                    <li class="nav-item dropdown">
                        <a style="background-color: #adccea; border-radius: 6px" class="nav-link btn-primary dropdown-toggle"
                           data-i18n="language" href="#" role="button" data-bs-toggle="dropdown" aria-expanded="false">
                        </a>
                        <ul id="language-menu" class="dropdown-menu">
                            <li><a class="dropdown-item" data-lang="cs" href="#">CS</a></li>
                            <li><a class="dropdown-item" data-lang="en" href="#">EN</a></li>
                            <li><a class="dropdown-item" data-lang="ru" href="#">RU</a></li>
                        </ul>
                    </li>
                </ul>
                <a class="navbar-brand" href="#">
                    <img src="logo.png" alt="Logo" width="90" height="90" class="d-inline-block align-text-top">
                </a>
            </div>
        </div>
    </nav>
</header>

<div class="container">
    <div class="row row-cols-1 row-cols-md-2 mx-1 mx-md-0 mt-0 gy-4">
        <div class="col d-flex justify-content-start justify-content-md-center">
            <img src="photo.jpg" class="img-fluid rounded-4" alt="Photo">
        </div>
        <div class="col d-flex flex-column">
            <p class="display-6 fw-bold" data-i18n="hello"></p>
            <p class="fs-4" data-i18n="heading"></p>
            <p class="fs-6" data-i18n="paragraph"></p>
            <div class="mt-auto d-flex gap-1 justify-content-center">
                    <a class="d-flex btn btn-bounce-circle btn-soft-info align-items-center justify-content-center"
                       href="https://drive.google.com/file/d/1kU24niOeHpnO9MnQH3ubHqokm4HqsQ2_/view?usp=sharing"
                       data-i18n="resume"></a>
                    <button type="button" class="btn btn-bounce-circle btn-soft-danger" data-bs-toggle="modal" data-bs-target="#confirmModal" data-i18n="projects"></button>
                    <div class="modal fade" id="confirmModal" tabindex="-1" aria-hidden="true">
                        <div class="modal-dialog modal-dialog-centered">
                            <div class="modal-content m-2">
                                <div class="modal-header">
                                    <h5 class="modal-title" data-i18n="modal"></h5>
                                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                                </div>
                                <div class="modal-body" data-i18n="modal_body">
                                </div>
                                <div class="d-flex m-3 justify-content-end">
                                    <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal" data-i18n="cancel"></button>
                                    <a href="mailto:okevteeva@gmail.com" class="ms-2 btn btn-danger" data-i18n="request"></a>
                                </div>
                            </div>
                        </div>
                    </div>
                    <a class=" d-flex btn btn-bounce-circle btn-soft-warning align-items-center justify-content-center" href="#contact" data-i18n="contacts"></a>
            </div>
        </div>
    </div>

    <div id="aboutMe" class="row row-cols-1 mx-2 mx-md-0 mt-4 gy-3">
        <div class="col d-flex justify-content-md-center">
            <p class="display-6 fw-bold" data-i18n="aboutMe"></p>
        </div>

        <div class="col">
            <div class="rounded-5 p-3" style="background-color: #ffd6d6;">
                <p class="fs-4 2" data-i18n="experience"></p>
                <p class="fs-6 mb-0" data-i18n="programming"></p>
                <p class="fs-6 mb-0" data-i18n="maternity"></p>
                <p class="fs-6" data-i18n="teacher"></p>
                <p class="fs-4" data-i18n="education"></p>
                <p class="fs-6 mb-3" data-i18n="paragraph1"></p>
                <p class="fs-6" data-i18n="paragraph2"></p>
                <p class="fs-4 mb-2" data-i18n="hobbies"></p>
                <p class="fs-6" data-i18n="paragraph3"></p>
            </div>
        </div>

        <div id="contact" class="col">
            <div class="rounded-5 p-3" style="background-color: #b0cde8;">
                <p class="fs-4 mb-2" data-i18n="contacts"></p>
                <p class="fs-6"><span class="fw-bold">✉️ E-mail: </span><a href="mailto:okevteeva@gmail.com">okevteeva@gmail.com</a></p>
            </div>
        </div>
    </div>
</div>

<footer class="text-center py-3 bg-light text-muted mt-5">© 2025 Oksana Arefeva</footer>

</body>
</html>
